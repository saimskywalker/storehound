name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: format, analyze, test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported SDK (pubspec.yaml) and a pinned current stable.
        sdk: ['3.8.0', '3.13.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The formatter's style follows the SDK version, so format is checked
      # on the pinned current SDK only.
      - if: matrix.sdk == '3.13.5'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: pub publish dry run
        run: dart pub publish --dry-run
      - name: run against the fixtures
        run: |
          dart run storehound --project test/fixtures/clean_app
          dart run storehound --project test/fixtures/rejected_app --sarif --output rejected.sarif || test $? -eq 1
      - name: production-shaped fixture has no findings
        run: |
          dart run storehound --project test/fixtures/production_app --fail-on info --today 2026-10-01 --brief --no-color > production.txt
          diff -u test/fixtures/production_app.golden.txt production.txt

  action:
    name: GitHub Action on the fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No security-events permission: the SARIF upload fails, the step passes.
      - name: clean fixture passes
        uses: ./ # zizmor: ignore[self-repository] actionlint does not know $/ yet
        with:
          project: test/fixtures/clean_app
          sarif: true
          artifact-name: storehound-clean
      - name: rejected fixture fails
        id: rejected
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] actionlint does not know $/ yet
        with:
          project: test/fixtures/rejected_app
          artifact-name: storehound-rejected
      - name: the rejected fixture failed the action
        env:
          OUTCOME: ${{ steps.rejected.outcome }}
        run: test "$OUTCOME" = failure
